# ============================================================
# 开放空间安全平台 —— nginx 反向代理配置（80 端口分流）
# 安装位置：/etc/nginx/conf.d/openspace.conf（由 deploy-docker.sh 自动安装）
#
# 说明：生产链路是 haproxy 直连本机 1233 / 1234（容器直接映射），本配置只负责
#   80 端口的按路径分流，与 haproxy 主链路无关。
#
# 分流规则：
#   /            → 前端容器 openspace-web   （宿主机 1233，容器内 nginx 托管 dist 静态包）
#   /cgi         → 后端容器 openspace-server（宿主机 1234，前台免登录接口）
#   /uploads     → 后端容器（公开静态库，支持 Range 流式播放）
#
# 修改后需重载：nginx -t && systemctl reload nginx
# ============================================================

server {
    listen      80;
    # 由 deploy-docker.sh 用 NGINX_SERVER_NAME 替换（域名或本机 IP）。
    # 只有 Host 与该名字匹配的请求才会走本应用；未匹配的仍归 nginx 原有默认站点，
    # 因此本配置不会抢占 80 端口的默认站点。
    server_name _;

    # 单文件最大 2GB（与后端 UPLOAD_MAX_SIZE 默认值一致）
    client_max_body_size 2048m;

    # 大文件上传/下载：请求不落盘缓冲，放宽超时
    proxy_request_buffering off;
    proxy_http_version      1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 30s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    # ---------- 后端：Swagger 文档（前台 /cgi-docs） ----------
    location /cgi-docs {
        proxy_pass http://127.0.0.1:1234;
    }

    # ---------- heat-sidecar：安全热力计算服务（/cgi2，必须排在 /cgi 之前） ----------
    location /cgi2 {
        proxy_pass http://127.0.0.1:1235;
        proxy_read_timeout 600s;
    }

    # ---------- 后端：接口（/cgi 前台免鉴权） ----------
    location /cgi {
        # /cgi/ai/chat 也是 SSE 长连接流式响应（前台智能体问答），同样必须关闭响应缓冲
        proxy_buffering off;
        # /cgi/ai/asr/stream 是语音识别 WebSocket：必须透传 Upgrade 头，否则升级失败
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 语音流是长连接，读超时放宽到 5 分钟（默认 60s 会在长录音时被网关掐断）
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:1234;
    }

    # ---------- 后端：公开静态库（支持 Range 视频流） ----------
    location /uploads {
        proxy_pass http://127.0.0.1:1234;
    }

    # ---------- 前端：容器内 nginx 托管 dist 静态包（无需 WebSocket 升级透传） ----------
    location / {
        proxy_pass http://127.0.0.1:1233;
    }
}

# ============================================================
# 前端容器【内置】nginx —— 只做 dist 静态托管（监听 1233）
# 安装位置：/etc/nginx/conf.d/default.conf（由 Dockerfile 构建时 COPY 进来）
#
# 说明：
#   /api、/cgi、/uploads 由【外层】nginx 或 haproxy 分流到后端容器（1234）
#   分流到后端 1234，本容器不代理任何后端请求，只负责把 vite 构建出的 dist 发出去。
#   dist 里 vite-plugin-compression 已为 js/css/html 生成同名 .gz，用 gzip_static
#   直接下发预压缩文件（不二次压缩，省 CPU、也最省带宽）。
#
# 注意：本配置按 VITE_BASE=/（根路径部署）编写；若构建时 VITE_BASE=/zxsd/，
#       需另加一个 location /zxsd/ { alias /usr/share/nginx/html/; } 才能命中子路径资源。
# ============================================================
server {
    listen 1233;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 下发 vite 预压缩的同名 .gz（文件不存在时自动回退原文件）
    gzip_static on;

    # 带内容 hash 的构建产物（js/css/字体/图片）→ 长期强缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 三维模型与纹理（map/，随源码更新、URL 不带 hash）→ 短缓存
    location /map/ {
        expires 1d;
        try_files $uri =404;
    }

    # DRACO 解码器（draco/，随 three 版本稳定）→ 长缓存
    location /draco/ {
        expires 30d;
        try_files $uri =404;
    }

    # SPA 回退：其余请求一律交给 index.html（vue-router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
}